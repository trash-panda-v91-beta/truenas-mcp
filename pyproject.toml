[project]
name = "truenas-mcp"
version = "0.1.0"
description = "MCP server for TrueNAS"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "trash-panda-v91-beta", email = "42897550+trash-panda-v91-beta@users.noreply.github.com" }]
keywords = ["mcp", "truenas"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastmcp==4.0.0b3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "truenas-api-client",
]

[project.urls]
# TODO: fill in Changelog = ""
# Documentation = ""
# Homepage = ""
# Issues = ""
# Repository = ""

[project.scripts]
truenas-mcp = "truenas_mcp.server:main"

[dependency-groups]
dev = [{ include-group = "test" }]
test = [
  "httpx2-pytest>=1.0.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
parallel = true
source = ["src"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
show_missing = true
skip_covered = false

[tool.hatch.build.targets.wheel]
packages = ["src/truenas_mcp"]

[tool.pytest]
markers = [
  "live_api: marks tests that hit a live TrueNAS instance",
  "skip_in_ci: marks tests to skip in CI",
]

[tool.uv]
package = true

[tool.uv.sources]
truenas-api-client = { git = "https://github.com/truenas/api_client.git", rev = "TS-25.10.3" }
